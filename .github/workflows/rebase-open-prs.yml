name: Keep Open PRs Mergeable

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows a manual run from the Actions tab for testing

permissions:
  contents: write
  pull-requests: write

# Queued rather than cancelled — abandoning a rebase mid-way in favor of a
# newer run would risk two runs racing on the same PR branch, the exact
# class of git-push race this whole workflow exists to clean up after.
concurrency:
  group: rebase-open-prs
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No npm dependencies — plain Node built-ins plus the gh CLI, which
      # ships preinstalled on GitHub-hosted runners.
      - name: Rebase any conflicting open PRs onto the latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rebase-open-prs.js
