name: Deploy widget to gh-pages

on:
  push:
    branches: [main]
    paths:
      - "widget/index.html"
      - "scripts/build-seo-pages.js"
  workflow_dispatch: {} # allows a manual re-deploy from the Actions tab

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for widget/index.html)
        uses: actions/checkout@v4
        with:
          path: main-checkout

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static SEO pages (per-film HTML, sitemap, robots.txt)
        run: node main-checkout/scripts/build-seo-pages.js main-checkout/widget/index.html main-checkout/seo-build

      - name: Copy widget + generated SEO assets and push if changed
        # COMMIT_MSG comes through env, never spliced directly into the
        # script text — a commit message containing backticks or $(...)
        # would otherwise be re-parsed as shell command substitution (the
        # exact bug already found and fixed in refresh-now-playing.yml).
        #
        # Stages before diffing (git diff --cached, not a plain git diff)
        # because a plain `git diff` never notices brand-new untracked
        # files — the same bug already found and fixed for
        # historical-cursor.json in refresh-now-playing.yml. sitemap.xml,
        # robots.txt, and every film/<slug>/ page are untracked the first
        # time they're generated, so this workflow would otherwise commit
        # nothing and silently believe there was nothing to deploy.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp main-checkout/widget/index.html gh-pages-checkout/index.html
          rm -rf gh-pages-checkout/film
          cp -r main-checkout/seo-build/film gh-pages-checkout/film
          cp main-checkout/seo-build/sitemap.xml gh-pages-checkout/sitemap.xml
          cp main-checkout/seo-build/robots.txt gh-pages-checkout/robots.txt
          cd gh-pages-checkout
          git config user.name "kernel-bot"
          git config user.email "actions@github.com"
          git add index.html film sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy: ${COMMIT_MSG:-manual re-deploy}"
          git push origin gh-pages
