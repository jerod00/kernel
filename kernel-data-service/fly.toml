# Fly.io app config for kernel-data-service.
# Deploy steps (run from this directory, after `fly auth login`):
#   fly launch --no-deploy   (first time only — creates the app; if the
#                              name below is taken, it'll prompt for another)
#   fly volumes create kernel_data --region iad --size 1
#   fly secrets set HMAC_SECRET=... TMDB_ACCESS_TOKEN=... OMDB_API_KEY=... ANTHROPIC_API_KEY=...
#   fly deploy

app = "kernel-data-service-themoviekernel"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/kernel.db"
  PUSH_SUBSCRIPTION_PATH = "/data/push-subscription.json"
  PORT = "3002"

[[mounts]]
  source = "kernel_data"
  destination = "/data"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
